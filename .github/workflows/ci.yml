name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: API 兼容性检查
        run: ./gradlew apiCheck
      - name: Lint
        run: ./gradlew :wsclient:lintRelease
      - name: 单元测试
        run: ./gradlew :wsclient:testDebugUnitTest
      - name: 构建开启 R8 的 sample
        run: ./gradlew :sample:assembleRelease
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports'
